name: Bootstrap executed RMS OPM ERT notebook

on:
  push:
    branches:
      - codex/rms-agent-opm-ert-notebook
    paths:
      - scripts/generate_rms_agent_opm_ert_notebook.py
      - .github/workflows/bootstrap-rms-agent-opm-ert-notebook.yml

permissions:
  contents: write

jobs:
  execute-publish-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install notebook runner
        run: |
          python -m pip install --quiet nbformat==5.10.4 nbconvert==7.16.6 jupyter-client ipykernel
          python -m ipykernel install --user --name python3 --display-name 'Python 3'
      - name: Generate notebook
        run: python scripts/generate_rms_agent_opm_ert_notebook.py
      - name: Execute every cell
        run: >-
          jupyter nbconvert --to notebook --execute --inplace
          --ExecutePreprocessor.timeout=4200
          --ExecutePreprocessor.iopub_timeout=120
          notebooks/reservoir/rms_to_opm_flow_agent_ert.ipynb
      - name: Write maintenance and catalog evidence
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          from pathlib import Path
          import platform

          notebook_path = Path('notebooks/reservoir/rms_to_opm_flow_agent_ert.ipynb')
          notebook = json.loads(notebook_path.read_text(encoding='utf-8'))
          code_cells = [cell for cell in notebook['cells'] if cell['cell_type'] == 'code']
          markdown_cells = [cell for cell in notebook['cells'] if cell['cell_type'] == 'markdown']
          missing = [index for index, cell in enumerate(code_cells, 1) if cell.get('execution_count') is None]
          errors = [output for cell in code_cells for output in cell.get('outputs', []) if output.get('output_type') == 'error']
          images = sum('image/png' in output.get('data', {}) for cell in code_cells for output in cell.get('outputs', []))
          if missing or errors or images < 11:
              raise RuntimeError({'missing': missing, 'errors': errors, 'images': images})

          result_candidates = list(Path('.').glob('**/rms_to_opm_outputs/run_results.json'))
          if len(result_candidates) != 1:
              raise RuntimeError(f'Expected one run_results.json, found {result_candidates}')
          results = json.loads(result_candidates[0].read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc)
          raw = notebook_path.read_bytes()
          git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()

          shard = {
              'schema_version': 1,
              'shard': 'rms-opm-ert-agent-20260831',
              'updated_at': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'notebooks': [{
                  'path': notebook_path.as_posix(),
                  'verified_date': now.strftime('%Y-%m-%d'),
                  'verified_at_utc': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'neqsim_version': '3.18.0 Python bridge with current source-built Java master',
                  'neqsim_commit': results['neqsim_commit'],
                  'neqsim_jar_sha256': results['neqsim_jar_sha256'],
                  'python_version': platform.python_version(),
                  'xtgeo_version': '4.25.1',
                  'opm_version': '2026.4',
                  'ert_version': '23.0.1',
                  'execution_status': 'passed',
                  'execution_method': 'Clean GitHub Actions Python 3.12 kernel; all cells executed top-to-bottom; NeqSim Java master built from source; OPM Flow base case and four ERT realizations completed.',
                  'code_cells': len(code_cells),
                  'substantive_code_cells': len(code_cells),
                  'markdown_cells': len(markdown_cells),
                  'git_blob_sha1': git_blob,
                  'notebook_bytes': len(raw),
                  'publication': {
                      'branch': 'codex/rms-agent-opm-ert-notebook',
                      'mode': 'focused draft pull request',
                      'files': [
                          notebook_path.as_posix(),
                          'README.md',
                          'notebooks/examples_of_NeqSim_in_Colab.ipynb',
                          'notebooks/notebook_maintenance_ledger.json',
                          'notebooks/maintenance_ledger/rms_opm_ert_agent_20260831.json',
                          '.github/workflows/rms-opm-ert-notebook-validation.yml',
                          'scripts/generate_rms_agent_opm_ert_notebook.py',
                      ],
                  },
                  'open_data': {
                      'repository': 'equinor/xtgeo-testdata',
                      'commit': results['data_commit'],
                      'license': 'LGPL-3.0',
                      'dataset': 'Public Reek geological and simulation ROFF exports with RMS-origin provenance',
                      'integrity': 'Seven immutable files verified by embedded SHA-256 and byte counts.',
                  },
                  'capabilities_demonstrated': [
                      'XTGeo ROFF ingestion, grid QC, 2x2x4 blocking, facies spreading, GRDECL export',
                      'NeqSim master-source SRK characterization and black-oil PVT generation',
                      'OPM Flow corner-point simulation with summary and restart-state inspection',
                      'ERT four-realization ensemble experiment using the FLOW forward model',
                      'NeqSim surface-process handover and governed RMS-agent job contract',
                  ],
                  'engineering_validation': {
                      'named_assertions_passed': results['validation_checks_passed'],
                      'assertions_failed': 0,
                      'retained_png_figures': images,
                  },
                  'result_summary': results,
                  'rendered_visual_validation': {
                      'renderer': 'nbconvert HTML plus retained Matplotlib PNG outputs',
                      'figures_retained': images,
                      'result': 'pending human visual inspection before draft PR',
                  },
                  'known_upstream_issue': None,
                  'issue_handling': 'No upstream defect is claimed; limitations distinguish teaching assumptions from decision-grade RMS studies.',
              }],
          }
          shard_path = Path('notebooks/maintenance_ledger/rms_opm_ert_agent_20260831.json')
          shard_path.write_text(json.dumps(shard, indent=2) + '\n', encoding='utf-8')

          root_ledger_path = Path('notebooks/notebook_maintenance_ledger.json')
          root_ledger = json.loads(root_ledger_path.read_text(encoding='utf-8'))
          root_ledger['active_notebook_count'] = int(root_ledger['active_notebook_count']) + 1
          root_ledger['updated_at'] = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          root_ledger_path.write_text(json.dumps(root_ledger, indent=2) + '\n', encoding='utf-8')

          catalog_path = Path('notebooks/examples_of_NeqSim_in_Colab.ipynb')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          target = 'reservoir/rms_to_opm_flow_agent_ert.ipynb'
          if target not in json.dumps(catalog):
              catalog['cells'].append({
                  'cell_type': 'markdown',
                  'metadata': {},
                  'source': [
                      '## RMS-origin reservoir automation\n',
                      '\n',
                      '- [RMS-origin Reek to OPM Flow, ERT, and NeqSim](reservoir/rms_to_opm_flow_agent_ert.ipynb): blocking, property spreading, real simulation, uncertainty, and an RMS-agent contract.\n',
                  ],
              })
              catalog_path.write_text(json.dumps(catalog, indent=1) + '\n', encoding='utf-8')
          print({'code_cells': len(code_cells), 'markdown_cells': len(markdown_cells), 'images': images, 'results': results})
          PY
      - name: Validate repository and notebook contracts
        run: |
          python scripts/check_notebook.py notebooks/reservoir/rms_to_opm_flow_agent_ert.ipynb --require-main-source
      - name: Render HTML for visual review
        run: >-
          jupyter nbconvert --to html
          --output rms_to_opm_flow_agent_ert.html
          notebooks/reservoir/rms_to_opm_flow_agent_ert.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: rms-opm-ert-bootstrap-evidence
          path: |
            notebooks/reservoir/rms_to_opm_flow_agent_ert.ipynb
            notebooks/reservoir/rms_to_opm_flow_agent_ert.html
          if-no-files-found: error
          retention-days: 14
      - name: Commit executed evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/bootstrap-rms-agent-opm-ert-notebook.yml
          git add -- notebooks/reservoir/rms_to_opm_flow_agent_ert.ipynb
          git add -- notebooks/examples_of_NeqSim_in_Colab.ipynb
          git add -- notebooks/notebook_maintenance_ledger.json
          git add -- notebooks/maintenance_ledger/rms_opm_ert_agent_20260831.json
          git commit -m 'Add executed RMS to OPM Flow and ERT notebook'
          git push origin HEAD:codex/rms-agent-opm-ert-notebook
