name: Execute process-coupled electrification notebook

on:
  workflow_dispatch:
  push:
    paths:
      - notebooks/power/process_coupled_offshore_electrification_study.ipynb
      - scripts/check_notebook.py
      - .github/workflows/execute-process-coupled-electrification.yml

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            nbclient==0.10.2 \
            nbformat==5.10.4 \
            ipykernel==6.29.5 \
            matplotlib==3.10.3 \
            numpy==2.2.6 \
            pandas==2.2.3

      - name: Run static notebook checks
        run: |
          python scripts/check_notebook.py \
            notebooks/power/process_coupled_offshore_electrification_study.ipynb

      - name: Execute notebook
        run: |
          mkdir -p executed
          python - <<'PY'
          from pathlib import Path

          import nbformat
          from nbclient import NotebookClient

          source = Path(
              "notebooks/power/"
              "process_coupled_offshore_electrification_study.ipynb"
          )
          target = Path(
              "executed/"
              "process_coupled_offshore_electrification_study.ipynb"
          )
          notebook = nbformat.read(source, as_version=4)
          client = NotebookClient(
              notebook,
              timeout=3600,
              kernel_name="python3",
              allow_errors=False,
              resources={"metadata": {"path": str(Path.cwd())}},
          )
          executed = client.execute()
          nbformat.write(executed, target)
          print(target)
          PY

      - name: Validate stored outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "executed/"
              "process_coupled_offshore_electrification_study.ipynb"
          )
          notebook = json.loads(path.read_text(encoding="utf-8"))
          code_cells = [
              cell
              for cell in notebook["cells"]
              if cell["cell_type"] == "code"
          ]
          errors = [
              output
              for cell in code_cells
              for output in cell.get("outputs", [])
              if output.get("output_type") == "error"
          ]
          image_count = sum(
              "image/png" in output.get("data", {})
              for cell in code_cells
              for output in cell.get("outputs", [])
          )
          output_text = "\n".join(
              "".join(output.get("text", ""))
              for cell in code_cells
              for output in cell.get("outputs", [])
              if output.get("output_type") == "stream"
          )
          assert not errors
          assert all(cell["execution_count"] is not None for cell in code_cells)
          assert image_count >= 8
          assert "validation gates passed" in output_text
          print(f"Executed code cells: {len(code_cells)}")
          print(f"Stored figures: {image_count}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: process-coupled-electrification-executed
          path: executed/process_coupled_offshore_electrification_study.ipynb
          if-no-files-found: error
          retention-days: 7
