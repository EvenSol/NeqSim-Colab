name: CO2 low-temperature notebook validation

on:
  push:
    branches:
      - codex/co2-low-temperature-model-study
  pull_request:
    paths:
      - notebooks/thermodynamics/CO2_low_temperature_compression_relief_and_depressurization.ipynb
      - notebooks/examples_of_NeqSim_in_Colab.ipynb
      - notebooks/maintenance_ledger/co2_low_temperature_20260813.json
      - notebooks/notebook_maintenance_ledger.json
      - .github/workflows/co2-low-temperature-notebook-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out NeqSim-Colab
        uses: actions/checkout@v7

      - name: Check out current NeqSim master
        uses: actions/checkout@v7
        with:
          repository: equinor/neqsim
          ref: master
          fetch-depth: 1
          path: neqsim-source

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build current NeqSim master
        working-directory: neqsim-source
        run: ./mvnw -q -DskipTests -Dmaven.javadoc.skip=true package

      - name: Record source-built runtime
        shell: bash
        run: |
          SOURCE_JAR=$(find "$GITHUB_WORKSPACE/neqsim-source/target" -maxdepth 1 -type f -name 'neqsim-*.jar' | grep -Ev '(sources|javadoc|tests|original)' | sort | head -n 1)
          test -n "$SOURCE_JAR"
          SOURCE_COMMIT=$(git -C "$GITHUB_WORKSPACE/neqsim-source" rev-parse HEAD)
          SOURCE_SHA256=$(sha256sum "$SOURCE_JAR" | awk '{print $1}')
          echo "NEQSIM_SOURCE_ROOT=$GITHUB_WORKSPACE/neqsim-source" >> "$GITHUB_ENV"
          echo "NEQSIM_SOURCE_JAR=$SOURCE_JAR" >> "$GITHUB_ENV"
          printf 'commit=%s\njar_sha256=%s\njar_name=%s\n' \
            "$SOURCE_COMMIT" "$SOURCE_SHA256" "$(basename "$SOURCE_JAR")" \
            > "$GITHUB_WORKSPACE/neqsim-source-build-metadata.txt"
          cat "$GITHUB_WORKSPACE/neqsim-source-build-metadata.txt"

      - name: Upload source-built NeqSim runtime
        uses: actions/upload-artifact@v4
        with:
          name: neqsim-current-master-runtime
          path: |
            ${{ env.NEQSIM_SOURCE_JAR }}
            neqsim-source-build-metadata.txt
          retention-days: 7

      - name: Create clean validation environment
        run: |
          python scripts/bootstrap_neqsim_validation_env.py \
            --venv /tmp/neqsim-co2-validation \
            --wheelhouse-root /tmp/neqsim-validation-wheelhouse \
            --neqsim-version 3.17.0 \
            --refresh \
            --extra-package CoolProp==8.0.0 \
            --extra-package nbconvert==7.17.1

      - name: Execute notebook from top to bottom
        env:
          MPLCONFIGDIR: /tmp/matplotlib-co2-relief
          IPYTHONDIR: /tmp/ipython-co2-relief
        run: |
          /tmp/neqsim-co2-validation/bin/python \
            scripts/execute_notebook_inprocess.py \
            notebooks/thermodynamics/CO2_low_temperature_compression_relief_and_depressurization.ipynb

      - name: Run notebook integrity checks
        run: |
          /tmp/neqsim-co2-validation/bin/python scripts/check_notebook.py \
            notebooks/thermodynamics/CO2_low_temperature_compression_relief_and_depressurization.ipynb \
            --require-main-source

      - name: Render notebook to HTML
        run: |
          /tmp/neqsim-co2-validation/bin/jupyter nbconvert \
            --to html \
            --output co2_low_temperature_analysis.html \
            notebooks/thermodynamics/CO2_low_temperature_compression_relief_and_depressurization.ipynb

      - name: Verify retained execution evidence
        run: |
          /tmp/neqsim-co2-validation/bin/python - <<'PY'
          from pathlib import Path
          import nbformat

          path = Path(
              "notebooks/thermodynamics/"
              "CO2_low_temperature_compression_relief_and_depressurization.ipynb"
          )
          notebook = nbformat.read(path, as_version=4)
          code_cells = [
              cell for cell in notebook.cells if cell.cell_type == "code"
          ]
          errors = []
          stderr = []
          figures = 0
          for cell in code_cells:
              for output in cell.get("outputs", []):
                  if output.output_type == "error":
                      errors.append(output)
                  if output.output_type == "stream" and output.name == "stderr":
                      stderr.append(output.text)
                  if (
                      output.output_type in ("display_data", "execute_result")
                      and "image/png" in output.get("data", {})
                  ):
                      figures += 1

          assert len(code_cells) == 24
          assert [cell.execution_count for cell in code_cells] == list(range(1, 25))
          assert not errors
          assert not stderr
          assert figures == 8
          assert "All 12 engineering checks passed." in str(notebook)
          assert "NeqSim source commit:" in str(notebook)
          assert "Loaded main-only class from:" in str(notebook)
          print("Retained-output and scope checks passed.")
          PY

      - name: Upload executed notebook and rendered HTML
        uses: actions/upload-artifact@v4
        with:
          name: co2-low-temperature-source-executed
          path: |
            notebooks/thermodynamics/CO2_low_temperature_compression_relief_and_depressurization.ipynb
            notebooks/thermodynamics/co2_low_temperature_analysis.html
          retention-days: 7
