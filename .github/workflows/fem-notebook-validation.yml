name: FEM notebook execution validation

on:
  pull_request:
    branches: [master]
    paths:
      - "notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb"
      - "notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb"
      - ".github/workflows/fem-notebook-validation.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  execute-and-record:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/lab:stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install runtime dependencies
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jdk-headless git libglu1-mesa
          python -m pip install -q neqsim scikit-fem gmsh meshio pyvista scipy nbconvert
          mkdir -p /content

      - name: Patch notebooks to current runtime APIs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb"),
              Path("notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb"),
          ]

          jar_old_short = "jar=sorted((src/'target').glob('neqsim-*-shaded.jar'))[-1]"
          jar_new_short = """candidates=[p for p in (src/'target').glob('neqsim-*.jar') if '-sources' not in p.name and '-javadoc' not in p.name and not p.name.startswith('original-')]\nif not candidates: raise FileNotFoundError('No NeqSim runtime JAR found')\njar=max(candidates,key=lambda p:p.stat().st_size)\nassert jar.stat().st_size > 5_000_000"""
          jar_old_long = 'jars = sorted((src / "target").glob("neqsim-*-shaded.jar"))\nif not jars:\n    raise FileNotFoundError("No shaded NeqSim JAR produced")\nneqsim_jar = jars[-1]'
          jar_new_long = """candidates = [p for p in (src / 'target').glob('neqsim-*.jar') if '-sources' not in p.name and '-javadoc' not in p.name and not p.name.startswith('original-')]\nif not candidates:\n    raise FileNotFoundError('No NeqSim runtime JAR found')\nneqsim_jar = max(candidates, key=lambda p: p.stat().st_size)\nassert neqsim_jar.stat().st_size > 5_000_000"""

          pipeline_old = "cells,types,xyz=plot.vtk_mesh(Th.function_space); grid=pv.UnstructuredGrid(cells,types,xyz); grid.point_data['T [degC]']=Tc; pl=pv.Plotter(off_screen=True); pl.add_mesh(grid,scalars='T [degC]'); pl.view_xy(); pl.screenshot('/tmp/femT.png'); from IPython.display import Image,display; display(Image('/tmp/femT.png'))"
          pipeline_new = "plt.figure(figsize=(10,3)); sc=plt.scatter(c[:,0],c[:,1],c=Tc,s=10); plt.colorbar(sc,label='Temperature [degC]'); plt.axvspan(z0,z1,alpha=.12); plt.xlabel('Local z [m]'); plt.ylabel('Radius [m]'); plt.title('FEniCSx local temperature field'); plt.show()"

          gmsh_old = "cells,types,pts=plot.vtk_mesh(V); grid=pv.UnstructuredGrid(cells,types,pts); grid.point_data['Temperature [degC]']=uh.x.array-273.15; pl=pv.Plotter(off_screen=True,window_size=(1000,420)); pl.add_mesh(grid,scalars='Temperature [degC]',show_edges=True); pl.view_xy(); pl.screenshot('/tmp/gmsh_stack.png'); from IPython.display import Image,display; display(Image('/tmp/gmsh_stack.png'))"
          gmsh_new = "cells,types,pts=plot.vtk_mesh(V); grid=pv.UnstructuredGrid(cells,types,pts); grid.point_data['Temperature [degC]']=uh.x.array-273.15; assert grid.n_points==len(uh.x.array); print(grid); plt.figure(figsize=(10,3)); sc=plt.scatter(pts[:,0],pts[:,1],c=uh.x.array-273.15,s=10); plt.colorbar(sc,label='Temperature [degC]'); plt.xlabel('Axial coordinate [m]'); plt.ylabel('Radius [m]'); plt.title('Gmsh → FEniCSx field stored in PyVista'); plt.show()"

          well_old = "cells,types,pts=plot.vtk_mesh(Vw); gg=pv.UnstructuredGrid(cells,types,pts); gg.point_data['T [degC]']=Tw.x.array-273.15; pl=pv.Plotter(off_screen=True,window_size=(850,500)); pl.add_mesh(gg,scalars='T [degC]'); pl.view_xy(); pl.screenshot('/tmp/well.png'); display(Image('/tmp/well.png'))"
          well_new = "cells,types,pts=plot.vtk_mesh(Vw); gg=pv.UnstructuredGrid(cells,types,pts); gg.point_data['T [degC]']=Tw.x.array-273.15; assert gg.n_points==len(Tw.x.array); print(gg); plt.figure(figsize=(8,5)); sc=plt.scatter(pts[:,0],pts[:,1],c=Tw.x.array-273.15,s=8); plt.colorbar(sc,label='Temperature [degC]'); plt.xlabel('Depth coordinate [m]'); plt.ylabel('Radius [m]'); plt.title('Well/formation field stored in PyVista'); plt.show()"

          for path in paths:
              nb = json.loads(path.read_text())
              for i, cell in enumerate(nb["cells"]):
                  cell.setdefault("id", f"cell-{i:02d}")
                  if cell.get("cell_type") != "code":
                      continue
                  src = cell.get("source", "")
                  if isinstance(src, list):
                      src = "".join(src)
                  src = src.replace("importlib.metadata.version('fenics-dolfinx')", "dolfinx.__version__")
                  src = src.replace(jar_old_short, jar_new_short).replace(jar_old_long, jar_new_long)
                  if path.name == "neqsim_fenicsx_fem_pipeline.ipynb":
                      src = src.replace("petsc_options_prefix='heat_'", "petsc_options_prefix=f'heat_{nx}_{nr}_{int(defect)}_'")
                      src = src.replace(pipeline_old, pipeline_new)
                  else:
                      src = src.replace(gmsh_old, gmsh_new).replace(well_old, well_new)
                  cell["source"] = src
              path.write_text(json.dumps(nb, indent=1) + "\n")
          PY

      - name: Execute notebooks
        shell: bash
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          python scripts/execute_notebook_inprocess.py notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb
          python scripts/execute_notebook_inprocess.py notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb

      - name: Record catalog and maintenance evidence
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path
          import dolfinx

          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
          stamp = now.isoformat().replace("+00:00", "Z")
          day = str(now.date())
          commit = subprocess.check_output(["git", "-C", "/content/neqsim-java", "rev-parse", "HEAD"], text=True).strip()
          jars = [p for p in Path("/content/neqsim-java/target").glob("neqsim-*.jar") if "-sources" not in p.name and "-javadoc" not in p.name and not p.name.startswith("original-")]
          runtime_jar = max(jars, key=lambda p: p.stat().st_size)
          jar_sha = hashlib.sha256(runtime_jar.read_bytes()).hexdigest()

          catalog_path = Path("notebooks/examples_of_NeqSim_in_Colab.ipynb")
          catalog = json.loads(catalog_path.read_text())
          entry1 = "* **Advanced** - [NeqSim + FEniCSx local pipeline FEM](fluidflow/neqsim_fenicsx_fem_pipeline.ipynb): source-built NeqSim master supplies fluid properties and hydrate equilibrium; FEniCSx resolves local insulation degradation, cooldown, hydrate no-touch time, and thermo-elastic stress.\n"
          entry2 = "* **Advanced** - [Finite-element methods for oil & gas engineering with NeqSim](fluidflow/finite_element_methods_oil_gas_neqsim.ipynb): use NeqSim → Gmsh → scikit-fem/FEniCSx → PyVista for insulated-pipe heat transfer, damaged-insulation geometry, porous CO2 diffusion, and wellbore-to-formation heat conduction.\n"
          all_text = "\n".join("".join(c.get("source", [])) if isinstance(c.get("source"), list) else str(c.get("source", "")) for c in catalog["cells"])
          if "neqsim_fenicsx_fem_pipeline.ipynb" not in all_text:
              marker = "* [NeqSim + OpenFOAM CFD with inline flow graphics](fluidflow/neqsim_openfoam_cfd.ipynb)\n"
              for cell in catalog["cells"]:
                  if cell.get("cell_type") != "markdown":
                      continue
                  src = "".join(cell.get("source", [])) if isinstance(cell.get("source"), list) else str(cell.get("source", ""))
                  if marker in src:
                      cell["source"] = src.replace(marker, marker + entry1 + entry2).splitlines(keepends=True)
                      break
              else:
                  raise RuntimeError("Fluid mechanics catalog marker not found")
          catalog_path.write_text(json.dumps(catalog, indent=1) + "\n")

          nb_paths = [
              "notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb",
              "notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb",
          ]
          entries = []
          for path in nb_paths:
              nb = json.loads(Path(path).read_text())
              code = [c for c in nb["cells"] if c.get("cell_type") == "code"]
              assert code and all(c.get("execution_count") is not None for c in code)
              assert not any(o.get("output_type") == "error" for c in code for o in c.get("outputs", []))
              entries.append({
                  "path": path,
                  "verified_date": day,
                  "verified_at_utc": stamp,
                  "neqsim_version": f"source master commit {commit}",
                  "python_version": sys.version.split()[0],
                  "dolfinx_version": dolfinx.__version__,
                  "execution_status": "passed",
                  "execution_method": "Executed all code cells in dolfinx/lab:stable using scripts/execute_notebook_inprocess.py.",
                  "neqsim_source": {"repository": "equinor/neqsim", "ref": "master", "commit": commit, "jar_sha256": jar_sha, "runtime_guard": "Source-built runtime JAR loaded with JPype and SurfCooldownAnalyzer code-source asserted."},
                  "engineering_validation": {"assertions_failed": 0, "checks": ["all code cells executed", "zero stored exceptions", "explicit analytical/mesh/temperature checks passed"]},
                  "notebook_quality": {"valid_nbformat_json": True, "total_cells": len(nb["cells"]), "stored_error_outputs": 0},
              })

          shard = Path("notebooks/maintenance_ledger/fem_neqsim_gmsh_fenicsx_20260807.json")
          shard.write_text(json.dumps({"schema_version": 1, "updated_at": stamp, "notebooks": entries}, indent=1) + "\n")
          root_path = Path("notebooks/notebook_maintenance_ledger.json")
          root = json.loads(root_path.read_text())
          root["updated_at"] = stamp
          root["active_notebook_count"] = int(root["active_notebook_count"]) + 2
          root_path.write_text(json.dumps(root, indent=1) + "\n")
          PY

      - name: Integrity checks
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_check_notebook.py'
          python scripts/check_notebook.py notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb --require-main-source
          python scripts/check_notebook.py notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb --require-main-source
          python scripts/check_notebook.py --all --quiet-warnings

      - name: Commit executed notebooks and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fem-notebook-validation.yml
          git add notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb \
                  notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb \
                  notebooks/examples_of_NeqSim_in_Colab.ipynb \
                  notebooks/notebook_maintenance_ledger.json \
                  notebooks/maintenance_ledger/fem_neqsim_gmsh_fenicsx_20260807.json
          git commit -m "Execute and validate NeqSim FEM notebooks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
