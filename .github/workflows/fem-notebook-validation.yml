name: FEM notebook execution validation

on:
  pull_request:
    branches: [master]
    paths:
      - "notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb"
      - "notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb"
      - ".github/workflows/fem-notebook-validation.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  execute-and-record:
    runs-on: ubuntu-latest
    container:
      image: dolfinx/lab:stable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install runtime dependencies
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jdk-headless git libglu1-mesa
          python -m pip install -q neqsim scikit-fem gmsh meshio pyvista scipy nbconvert
          mkdir -p /content

      - name: Patch notebooks to current runtime APIs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb"),
              Path("notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb"),
          ]

          jar_old_short = "jar=sorted((src/'target').glob('neqsim-*-shaded.jar'))[-1]"
          jar_new_short = """candidates=[p for p in (src/'target').glob('neqsim-*.jar') if '-sources' not in p.name and '-javadoc' not in p.name and not p.name.startswith('original-')]\nif not candidates: raise FileNotFoundError('No NeqSim runtime JAR found')\njar=max(candidates,key=lambda p:p.stat().st_size)\nassert jar.stat().st_size > 5_000_000"""
          jar_old_long = 'jars = sorted((src / "target").glob("neqsim-*-shaded.jar"))\nif not jars:\n    raise FileNotFoundError("No shaded NeqSim JAR produced")\nneqsim_jar = jars[-1]'
          jar_new_long = """candidates = [p for p in (src / 'target').glob('neqsim-*.jar') if '-sources' not in p.name and '-javadoc' not in p.name and not p.name.startswith('original-')]\nif not candidates:\n    raise FileNotFoundError('No NeqSim runtime JAR found')\nneqsim_jar = max(candidates, key=lambda p: p.stat().st_size)\nassert neqsim_jar.stat().st_size > 5_000_000"""

          thermal_safe = '''def tags_rect(m,rmin,rmax):
    fd=m.topology.dim-1
    a=mesh.locate_entities_boundary(m,fd,lambda x:np.isclose(x[1],rmin))
    b=mesh.locate_entities_boundary(m,fd,lambda x:np.isclose(x[1],rmax))
    e=np.hstack([a,b]).astype(np.int32)
    val=np.hstack([np.ones(len(a),np.int32),2*np.ones(len(b),np.int32)])
    o=np.argsort(e)
    return mesh.meshtags(m,fd,e[o],val[o])

def solve_thermal(nx=100,nr=24):
    m=mesh.create_rectangle(MPI.COMM_WORLD,np.array([[0.,ri],[localL,ro]]),[nx,nr],cell_type=mesh.CellType.triangle)
    tag=tags_rect(m,ri,ro)
    ds=ufl.Measure('ds',domain=m,subdomain_data=tag); dx=ufl.Measure('dx',domain=m)
    V=fem.functionspace(m,('Lagrange',1)); u=ufl.TrialFunction(V); w=ufl.TestFunction(V)
    X=ufl.SpatialCoordinate(m); r=X[1]
    kb=ufl.conditional(ufl.le(r,rs),ks,kins)
    bad=ufl.And(ufl.And(ufl.ge(X[0],z0),ufl.le(X[0],z1)),ufl.gt(r,rs))
    k=ufl.conditional(bad,kbad,kb)
    a=k*ufl.inner(ufl.grad(u),ufl.grad(w))*2*np.pi*r*dx+hi*u*w*2*np.pi*r*ds(1)+ho*u*w*2*np.pi*r*ds(2)
    L=hi*(Tb+273.15)*w*2*np.pi*r*ds(1)+ho*(Tsea+273.15)*w*2*np.pi*r*ds(2)
    problem=LinearProblem(a,L,petsc_options_prefix='heat_main_',petsc_options={'ksp_type':'cg','pc_type':'jacobi','ksp_rtol':1e-10})
    uh=problem.solve()
    assert problem.solver.getConvergedReason()>0
    return m,tag,uh,problem

m,tag,Th,thermal_problem=solve_thermal()
c=Th.function_space.tabulate_dof_coordinates(); Tc=Th.x.array-273.15
mask=np.isclose(c[:,1],ri); zz=c[mask,0]; ww=Tc[mask]; order=np.argsort(zz)
R=Rprime(); q_uniform=(Tb-Tsea)/R; T_analytic=Tb-q_uniform/(hi*2*np.pi*ri)
far_mask=mask & ((c[:,0]<0.55)|(c[:,0]>3.45)); T_far=float(Tc[far_mask].mean())
assert Tsea-1e-6 <= float(Tc.min()) <= float(Tc.max()) <= Tb+1e-6
assert abs(T_far-T_analytic)<1.5
assert float(ww.min()) < T_far
print(f'Analytical uniform inner-wall T: {T_analytic:.3f} degC')
print(f'FEM far-field inner-wall T: {T_far:.3f} degC')
print(f'FEM defect minimum inner-wall T: {float(ww.min()):.3f} degC')
plt.plot(zz[order],ww[order]); plt.axvspan(z0,z1,alpha=.2); plt.axhline(T_analytic,ls='--',label='uniform analytical'); plt.xlabel('Local z [m]'); plt.ylabel('Inner wall T [degC]'); plt.legend(); plt.grid(); plt.show()
plt.figure(figsize=(10,3)); sc=plt.scatter(c[:,0],c[:,1],c=Tc,s=10); plt.colorbar(sc,label='Temperature [degC]'); plt.axvspan(z0,z1,alpha=.12); plt.xlabel('Local z [m]'); plt.ylabel('Radius [m]'); plt.title('FEniCSx local temperature field'); plt.show()'''

          cooldown_safe = '''h=fluid(Tb,Pb,True)
ThermodynamicOperations(h).hydrateFormationTemperature()
Thyd=float(h.getTemperature('C')); target=Thyd+3.
s=SurfCooldownAnalyzer(fluid(Tb,Pb))
s.setInternalDiameter(Di); s.setWallThickness(ts); s.setInsulationThickness(ti); s.setInsulationConductivity(kins); s.setExternalHTC(ho)
s.setSeabedTemperature(Tsea); s.setOperatingTemperature(Tb); s.setHydrateMargin(3.); s.setTotalTimeHours(48.); s.calculate()
print('Hydrate equilibrium:',Thyd,'degC; lumped no-touch:',float(s.getNoTouchTimeHours()),'h')

def cooldown(dt=1800.,hours=48.):
    m=mesh.create_rectangle(MPI.COMM_WORLD,np.array([[0.,ri],[localL,ro]]),[50,14],cell_type=mesh.CellType.triangle)
    tag=tags_rect(m,ri,ro); ds=ufl.Measure('ds',domain=m,subdomain_data=tag); dx=ufl.Measure('dx',domain=m)
    V=fem.functionspace(m,('Lagrange',1)); X=ufl.SpatialCoordinate(m); r=X[1]
    kb=ufl.conditional(ufl.le(r,rs),ks,kins); bad=ufl.And(ufl.And(ufl.ge(X[0],z0),ufl.le(X[0],z1)),ufl.gt(r,rs)); k=ufl.conditional(bad,kbad,kb)
    C=ufl.conditional(ufl.le(r,rs),rhos*cps,rhoi*cpi)
    un=fem.Function(V); un.x.array[:]=Tb+273.15
    u=ufl.TrialFunction(V); w=ufl.TestFunction(V)
    B=fem.Constant(m,PETSc.ScalarType(Tb+273.15)); S=fem.Constant(m,PETSc.ScalarType(Tsea+273.15))
    a=C*u*w*2*np.pi*r*dx+dt*k*ufl.inner(ufl.grad(u),ufl.grad(w))*2*np.pi*r*dx+dt*hi*u*w*2*np.pi*r*ds(1)+dt*ho*u*w*2*np.pi*r*ds(2)
    L=C*un*w*2*np.pi*r*dx+dt*hi*B*w*2*np.pi*r*ds(1)+dt*ho*S*w*2*np.pi*r*ds(2)
    problem=LinearProblem(a,L,petsc_options_prefix='cooldown_main_',petsc_options={'ksp_type':'cg','pc_type':'jacobi','ksp_rtol':1e-9})
    gp=props(Tb,Pb); fluidC=gp['rho']*np.pi*ri**2*localL*gp['cp']
    times=[0.]; bulk=[Tb]; wall=[Tb]; coords=V.tabulate_dof_coordinates(); inner=np.isclose(coords[:,1],ri)
    for n in range(int(hours*3600/dt)):
        B.value=PETSc.ScalarType(bulk[-1]+273.15)
        uu=problem.solve(); assert problem.solver.getConvergedReason()>0
        q=fem.assemble_scalar(fem.form(hi*(B-uu)*2*np.pi*r*ds(1)))
        bulk.append(float(B.value)-q*dt/fluidC-273.15)
        wall.append(float((uu.x.array-273.15)[inner].min()))
        times.append((n+1)*dt/3600.)
        un.x.array[:]=uu.x.array
    return np.array(times),np.array(bulk),np.array(wall),problem

tc,bc,wc,cooldown_problem=cooldown()
def crossing(y):
    idx=np.where(y<=target)[0]
    return tc[idx[0]] if len(idx) else np.inf
print('FEM bulk no-touch:',crossing(bc),'h; local wall no-touch:',crossing(wc),'h')
assert np.all(np.diff(bc)<=1e-6)
plt.plot(tc,bc,label='bulk'); plt.plot(tc,wc,label='min wall'); plt.axhline(target,ls='--',label='hydrate + margin'); plt.legend(); plt.xlabel('Time [h]'); plt.ylabel('Temperature [degC]'); plt.grid(); plt.show()'''

          gmsh_old = "cells,types,pts=plot.vtk_mesh(V); grid=pv.UnstructuredGrid(cells,types,pts); grid.point_data['Temperature [degC]']=uh.x.array-273.15; pl=pv.Plotter(off_screen=True,window_size=(1000,420)); pl.add_mesh(grid,scalars='Temperature [degC]',show_edges=True); pl.view_xy(); pl.screenshot('/tmp/gmsh_stack.png'); from IPython.display import Image,display; display(Image('/tmp/gmsh_stack.png'))"
          gmsh_new = "cells,types,pts=plot.vtk_mesh(V); grid=pv.UnstructuredGrid(cells,types,pts); grid.point_data['Temperature [degC]']=uh.x.array-273.15; assert grid.n_points==len(uh.x.array); print(grid); plt.figure(figsize=(10,3)); sc=plt.scatter(pts[:,0],pts[:,1],c=uh.x.array-273.15,s=10); plt.colorbar(sc,label='Temperature [degC]'); plt.xlabel('Axial coordinate [m]'); plt.ylabel('Radius [m]'); plt.title('Gmsh → FEniCSx field stored in PyVista'); plt.show()"
          well_old = "cells,types,pts=plot.vtk_mesh(Vw); gg=pv.UnstructuredGrid(cells,types,pts); gg.point_data['T [degC]']=Tw.x.array-273.15; pl=pv.Plotter(off_screen=True,window_size=(850,500)); pl.add_mesh(gg,scalars='T [degC]'); pl.view_xy(); pl.screenshot('/tmp/well.png'); display(Image('/tmp/well.png'))"
          well_new = "cells,types,pts=plot.vtk_mesh(Vw); gg=pv.UnstructuredGrid(cells,types,pts); gg.point_data['T [degC]']=Tw.x.array-273.15; assert gg.n_points==len(Tw.x.array); print(gg); plt.figure(figsize=(8,5)); sc=plt.scatter(pts[:,0],pts[:,1],c=Tw.x.array-273.15,s=8); plt.colorbar(sc,label='Temperature [degC]'); plt.xlabel('Depth coordinate [m]'); plt.ylabel('Radius [m]'); plt.title('Well/formation field stored in PyVista'); plt.show()"

          for path in paths:
              nb=json.loads(path.read_text())
              for i,cell in enumerate(nb['cells']):
                  cell.setdefault('id',f'cell-{i:02d}')
                  if cell.get('cell_type')!='code': continue
                  src=cell.get('source',''); src=''.join(src) if isinstance(src,list) else src
                  src=src.replace("importlib.metadata.version('fenics-dolfinx')","dolfinx.__version__")
                  src=src.replace(jar_old_short,jar_new_short).replace(jar_old_long,jar_new_long)
                  if path.name=='neqsim_fenicsx_fem_pipeline.ipynb':
                      if 'def tags_rect' in src: src=thermal_safe
                      elif 'def cooldown' in src: src=cooldown_safe
                  else:
                      src=src.replace(gmsh_old,gmsh_new).replace(well_old,well_new)
                  cell['source']=src
              path.write_text(json.dumps(nb,indent=1)+'\n')
          PY

      - name: Execute notebooks
        shell: bash
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          python scripts/execute_notebook_inprocess.py notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb
          python scripts/execute_notebook_inprocess.py notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb

      - name: Record catalog and maintenance evidence
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, json, subprocess, sys
          from pathlib import Path
          import dolfinx
          now=dt.datetime.now(dt.timezone.utc).replace(microsecond=0); stamp=now.isoformat().replace('+00:00','Z'); day=str(now.date())
          commit=subprocess.check_output(['git','-C','/content/neqsim-java','rev-parse','HEAD'],text=True).strip()
          jars=[p for p in Path('/content/neqsim-java/target').glob('neqsim-*.jar') if '-sources' not in p.name and '-javadoc' not in p.name and not p.name.startswith('original-')]
          runtime_jar=max(jars,key=lambda p:p.stat().st_size); jar_sha=hashlib.sha256(runtime_jar.read_bytes()).hexdigest()
          cp=Path('notebooks/examples_of_NeqSim_in_Colab.ipynb'); catalog=json.loads(cp.read_text())
          e1="* **Advanced** - [NeqSim + FEniCSx local pipeline FEM](fluidflow/neqsim_fenicsx_fem_pipeline.ipynb): source-built NeqSim master supplies fluid properties and hydrate equilibrium; FEniCSx resolves local insulation degradation, cooldown, hydrate no-touch time, and thermo-elastic stress.\n"
          e2="* **Advanced** - [Finite-element methods for oil & gas engineering with NeqSim](fluidflow/finite_element_methods_oil_gas_neqsim.ipynb): use NeqSim → Gmsh → scikit-fem/FEniCSx → PyVista for insulated-pipe heat transfer, damaged-insulation geometry, porous CO2 diffusion, and wellbore-to-formation heat conduction.\n"
          text='\n'.join(''.join(c.get('source',[])) if isinstance(c.get('source'),list) else str(c.get('source','')) for c in catalog['cells'])
          if 'neqsim_fenicsx_fem_pipeline.ipynb' not in text:
              marker='* [NeqSim + OpenFOAM CFD with inline flow graphics](fluidflow/neqsim_openfoam_cfd.ipynb)\n'
              for cell in catalog['cells']:
                  src=''.join(cell.get('source',[])) if isinstance(cell.get('source'),list) else str(cell.get('source',''))
                  if cell.get('cell_type')=='markdown' and marker in src:
                      cell['source']=src.replace(marker,marker+e1+e2).splitlines(keepends=True); break
              else: raise RuntimeError('Fluid mechanics catalog marker not found')
          cp.write_text(json.dumps(catalog,indent=1)+'\n')
          entries=[]
          for p in ['notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb','notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb']:
              nb=json.loads(Path(p).read_text()); code=[c for c in nb['cells'] if c.get('cell_type')=='code']
              assert code and all(c.get('execution_count') is not None for c in code); assert not any(o.get('output_type')=='error' for c in code for o in c.get('outputs',[]))
              entries.append({'path':p,'verified_date':day,'verified_at_utc':stamp,'neqsim_version':f'source master commit {commit}','python_version':sys.version.split()[0],'dolfinx_version':dolfinx.__version__,'execution_status':'passed','execution_method':'Executed all code cells in dolfinx/lab:stable using scripts/execute_notebook_inprocess.py.','neqsim_source':{'repository':'equinor/neqsim','ref':'master','commit':commit,'jar_sha256':jar_sha,'runtime_guard':'Source-built runtime JAR loaded with JPype and SurfCooldownAnalyzer code-source asserted.'},'engineering_validation':{'assertions_failed':0,'checks':['all code cells executed','zero stored exceptions','explicit analytical/numerical checks passed']},'notebook_quality':{'valid_nbformat_json':True,'total_cells':len(nb['cells']),'stored_error_outputs':0}})
          Path('notebooks/maintenance_ledger/fem_neqsim_gmsh_fenicsx_20260807.json').write_text(json.dumps({'schema_version':1,'updated_at':stamp,'notebooks':entries},indent=1)+'\n')
          rp=Path('notebooks/notebook_maintenance_ledger.json'); root=json.loads(rp.read_text()); root['updated_at']=stamp; root['active_notebook_count']=int(root['active_notebook_count'])+2; rp.write_text(json.dumps(root,indent=1)+'\n')
          PY

      - name: Integrity checks
        shell: bash
        run: |
          python -m unittest discover -s scripts -p 'test_check_notebook.py'
          python scripts/check_notebook.py notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb --require-main-source
          python scripts/check_notebook.py notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb --require-main-source
          python scripts/check_notebook.py --all --quiet-warnings

      - name: Commit executed notebooks and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fem-notebook-validation.yml
          git add notebooks/fluidflow/neqsim_fenicsx_fem_pipeline.ipynb notebooks/fluidflow/finite_element_methods_oil_gas_neqsim.ipynb notebooks/examples_of_NeqSim_in_Colab.ipynb notebooks/notebook_maintenance_ledger.json notebooks/maintenance_ledger/fem_neqsim_gmsh_fenicsx_20260807.json
          git commit -m "Execute and validate NeqSim FEM notebooks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
