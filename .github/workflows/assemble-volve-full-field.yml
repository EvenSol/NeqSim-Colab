name: Assemble Volve full-field notebook
on:
  push:
    branches:
      - agent/volve-full-field-development
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify notebook
        shell: bash
        run: |
          mkdir -p notebooks/fielddevelopment
          cat .github/volve-notebook-parts/part-* > notebooks/fielddevelopment/volve_full_field_development_opm_neqsim.ipynb
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path("notebooks/fielddevelopment/volve_full_field_development_opm_neqsim.ipynb")
          expected = "ad14b810f5ade3eec97dc79b40a2d01f70039cd0f7aa2b2d4ffda9fb54fb0cab"
          assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
          notebook = json.loads(path.read_text())
          assert len(notebook["cells"]) == 66
          assert sum(cell["cell_type"] == "code" for cell in notebook["cells"]) == 35
          assert not any(
              output.get("output_type") == "error"
              for cell in notebook["cells"]
              for output in cell.get("outputs", [])
          )
          PY
      - name: Replace staging parts with notebook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -- .github/volve-notebook-parts
          git rm -- .github/workflows/assemble-volve-full-field.yml
          git add -- notebooks/fielddevelopment/volve_full_field_development_opm_neqsim.ipynb
          git commit -m "Assemble executed Volve full-field notebook"
          git push origin HEAD:agent/volve-full-field-development
